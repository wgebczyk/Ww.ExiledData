<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="face" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFFBEA"/>
      <stop offset="0.55" stop-color="#F6E3A8"/>
      <stop offset="1" stop-color="#E2C27A"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8B566"/>
      <stop offset="0.5" stop-color="#B48A3A"/>
      <stop offset="1" stop-color="#8C6524"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AD802F"/>
      <stop offset="1" stop-color="#85601F"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6B5320" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="116" fill="url(#rim)"/>
    <circle cx="128" cy="128" r="115" fill="none" stroke="#7A561C" stroke-width="2"/>
    <circle cx="128" cy="128" r="98" fill="url(#face)"/>
    <circle cx="128" cy="128" r="98" fill="none" stroke="#9C7430" stroke-width="3"/>
    <circle cx="128" cy="128" r="88" fill="none" stroke="#D9BC7C" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>

    <text x="128" y="159" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-weight="bold" font-size="76" fill="#FFFDF2">DIV</text>
    <text x="128" y="156" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-weight="bold" font-size="76" fill="url(#txt)">DIV</text>

    <!-- light streak / crack across the V -->
    <g fill="none" stroke-linejoin="miter" stroke-linecap="round">
      <polyline transform="translate(1.4,1.4)" stroke="#FFFDF0" stroke-width="4"
        points="208,70 196,84 199,93 183,104 186,116 168,124 171,136 154,146 157,158 140,168 138,182 122,190"/>
      <polyline stroke="#D9B66C" stroke-width="3"
        points="208,70 196,84 199,93 183,104 186,116 168,124 171,136 154,146 157,158 140,168 138,182 122,190"/>
      <polyline stroke="#D9B66C" stroke-width="2" points="186,116 204,124 212,138"/>
      <polyline stroke="#D9B66C" stroke-width="1.6" points="157,158 170,172"/>
      <polyline stroke="#D9B66C" stroke-width="1.6" points="122,190 112,198"/>
    </g>
  </g>
</svg>
